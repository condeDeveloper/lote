name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: todo item e gravado uma vez so
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: gravacoes por item por carga
        run: mvn -B -ntp -q exec:java -Dexec.args="carga"

      - name: a latencia que o agrupamento acrescenta
        run: mvn -B -ntp -q exec:java -Dexec.args="latencia"

      - name: o parametro so serve na carga em que foi ajustado
        run: mvn -B -ntp -q exec:java -Dexec.args="parametro"

      - name: o que acontece quando o transito para
        run: mvn -B -ntp -q exec:java -Dexec.args="parada"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
